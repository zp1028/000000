name: BTC Quant - Build Release APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build BTC Quant APK
    runs-on: ubuntu-latest

    env:
      ANDROID_PROJECT: ${{ github.workspace }}/android_project
      APK_OUTPUT: ${{ github.workspace }}/release
      LOG_OUTPUT: ${{ github.workspace }}/build_logs

    steps:

      # ============================================================
      # 1. Checkout
      # ============================================================
      - name: 1️⃣ Checkout
        uses: actions/checkout@v4

      # ============================================================
      # 2. JDK
      # ============================================================
      - name: 2️⃣ Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # ============================================================
      # 3. Locate source ZIP
      # ============================================================
      - name: 3️⃣ Locate Source ZIP
        shell: bash
        run: |
          set -euo pipefail

          echo "=================================================="
          echo "LOCATE SOURCE ZIP"
          echo "=================================================="

          ZIP_FILE=""

          while IFS= read -r -d '' file; do
            case "$file" in
              *.zip)
                ZIP_FILE="$file"
                break
                ;;
            esac
          done < <(find "$GITHUB_WORKSPACE" -maxdepth 3 -type f -name "*.zip" -print0)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No source ZIP found."
            exit 1
          fi

          echo "Source ZIP:"
          echo "$ZIP_FILE"

          echo "SOURCE_ZIP=$ZIP_FILE" >> "$GITHUB_ENV"

      # ============================================================
      # 4. Prepare directories
      # ============================================================
      - name: 4️⃣ Prepare Build Directories
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$ANDROID_PROJECT"
          rm -rf "$APK_OUTPUT"
          rm -rf "$LOG_OUTPUT"

          mkdir -p "$ANDROID_PROJECT"
          mkdir -p "$APK_OUTPUT"
          mkdir -p "$LOG_OUTPUT"

      # ============================================================
      # 5. Extract ZIP
      # ============================================================
      - name: 5️⃣ Extract Source
        shell: bash
        run: |
          set -euo pipefail

          echo "=================================================="
          echo "EXTRACT SOURCE"
          echo "=================================================="

          unzip -q "$SOURCE_ZIP" -d "$GITHUB_WORKSPACE/source"

          echo "Source extracted."

          find "$GITHUB_WORKSPACE/source" \
            -maxdepth 3 \
            -type f \
            \( \
              -name "settings.gradle" \
              -o -name "settings.gradle.kts" \
              -o -name "build.gradle" \
              -o -name "build.gradle.kts" \
            \) \
            -print | head -100

      # ============================================================
      # 6. Detect Android project root
      # ============================================================
      - name: 6️⃣ Detect Android Project
        shell: bash
        run: |
          set -euo pipefail

          echo "=================================================="
          echo "DETECT ANDROID PROJECT"
          echo "=================================================="

          BEST_ROOT=""

          while IFS= read -r -d '' settings_file; do

            candidate="$(dirname "$settings_file")"

            score=0

            if [ -f "$candidate/settings.gradle" ]; then
              score=$((score + 20))
            fi

            if [ -f "$candidate/settings.gradle.kts" ]; then
              score=$((score + 20))
            fi

            if [ -f "$candidate/build.gradle" ]; then
              score=$((score + 20))
            fi

            if [ -f "$candidate/build.gradle.kts" ]; then
              score=$((score + 20))
            fi

            if [ -f "$candidate/gradlew" ]; then
              score=$((score + 30))
            fi

            if [ -d "$candidate/app" ]; then
              score=$((score + 30))
            fi

            echo "Candidate: $candidate"
            echo "Score: $score"

            if [ -z "$BEST_ROOT" ]; then
              BEST_ROOT="$candidate"
              BEST_SCORE="$score"
            elif [ "$score" -gt "$BEST_SCORE" ]; then
              BEST_ROOT="$candidate"
              BEST_SCORE="$score"
            fi

          done < <(
            find "$GITHUB_WORKSPACE/source" \
              -type f \
              \( \
                -name "settings.gradle" \
                -o -name "settings.gradle.kts" \
              \) \
              -print0
          )

          if [ -z "$BEST_ROOT" ]; then
            echo "ERROR: Android project root not found."
            exit 1
          fi

          echo "Selected Android project:"
          echo "$BEST_ROOT"

          cp -a "$BEST_ROOT"/. "$ANDROID_PROJECT"/

          echo "DETECTED_ROOT=$BEST_ROOT" >> "$GITHUB_ENV"

      # ============================================================
      # 7. Validate Android project
      # ============================================================
      - name: 7️⃣ Validate Android Project
        shell: bash
        run: |
          set -euo pipefail

          echo "=================================================="
          echo "VALIDATE ANDROID PROJECT"
          echo "=================================================="

          cd "$ANDROID_PROJECT"

          if [ ! -f "settings.gradle" ] && \
             [ ! -f "settings.gradle.kts" ]; then
            echo "ERROR: settings.gradle(.kts) missing."
            exit 1
          fi

          if [ ! -f "build.gradle" ] && \
             [ ! -f "build.gradle.kts" ]; then
            echo "ERROR: root build.gradle(.kts) missing."
            exit 1
          fi

          if [ ! -d "app" ]; then
            echo "ERROR: app directory missing."
            exit 1
          fi

          echo "Android project structure OK."

      # ============================================================
      # 8. Repair Gradle Wrapper
      # ============================================================
      - name: 8️⃣ Repair Gradle Wrapper
        shell: bash
        run: |
          set -euo pipefail

          cd "$ANDROID_PROJECT"

          echo "=================================================="
          echo "CHECK GRADLE WRAPPER"
          echo "=================================================="

          NEED_WRAPPER_REPAIR=0

          if [ ! -x "./gradlew" ]; then
            NEED_WRAPPER_REPAIR=1
          fi

          if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            NEED_WRAPPER_REPAIR=1
          fi

          if [ "$NEED_WRAPPER_REPAIR" -eq 0 ]; then
            echo "Gradle wrapper appears complete."
            exit 0
          fi

          echo "Gradle wrapper requires repair."

          DISTRIBUTION_URL=""

          if [ -f "gradle/wrapper/gradle-wrapper.properties" ]; then
            DISTRIBUTION_URL="$(
              grep '^distributionUrl=' \
                gradle/wrapper/gradle-wrapper.properties \
                | head -1 \
                | cut -d'=' -f2-
            )"
          fi

          if [ -z "$DISTRIBUTION_URL" ]; then
            DISTRIBUTION_URL="https://services.gradle.org/distributions/gradle-8.9-bin.zip"
          fi

          echo "Gradle distribution:"
          echo "$DISTRIBUTION_URL"

          GRADLE_VERSION="$(
            echo "$DISTRIBUTION_URL" \
            | sed -n 's/.*gradle-\([0-9][0-9.]*\)-.*/\1/p'
          )"

          if [ -z "$GRADLE_VERSION" ]; then
            GRADLE_VERSION="8.9"
          fi

          echo "Using Gradle version: $GRADLE_VERSION"

          mkdir -p "$HOME/gradle"

          curl -L \
            --fail \
            --retry 3 \
            -o "$HOME/gradle/gradle.zip" \
            "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip"

          rm -rf "$HOME/gradle/current"

          unzip -q \
            "$HOME/gradle/gradle.zip" \
            -d "$HOME/gradle"

          GRADLE_BIN="$HOME/gradle/gradle-${GRADLE_VERSION}/bin/gradle"

          if [ ! -x "$GRADLE_BIN" ]; then
            echo "ERROR: Gradle executable not found."
            exit 1
          fi

          "$GRADLE_BIN" --version

          "$GRADLE_BIN" wrapper \
            --gradle-version "$GRADLE_VERSION"

          chmod +x ./gradlew

          if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "ERROR: gradle-wrapper.jar still missing."
            exit 1
          fi

          echo "Gradle wrapper repaired successfully."

      # ============================================================
      # 9. Validate wrapper
      # ============================================================
      - name: 9️⃣ Validate Gradle Wrapper
        shell: bash
        run: |
          set -euo pipefail

          cd "$ANDROID_PROJECT"

          ./gradlew --version

      # ============================================================
      # 10. Clean
      # ============================================================
      - name: 🔟 Clean Build
        shell: bash
        run: |
          set -euo pipefail

          cd "$ANDROID_PROJECT"

          ./gradlew clean \
            --no-daemon \
            --stacktrace \
            2>&1 | tee "$LOG_OUTPUT/clean.log"

      # ============================================================
      # 11. Build BTC Release
      # ============================================================
      - name: 1️⃣1️⃣ Build BTC Release
        shell: bash
        run: |
          set -euo pipefail

          cd "$ANDROID_PROJECT"

          ./gradlew assembleBtcRelease \
            --no-daemon \
            --stacktrace \
            2>&1 | tee "$LOG_OUTPUT/btc-release.log"

      # ============================================================
      # 12. Build Full Release
      # ============================================================
      - name: 1️⃣2️⃣ Build Full Release
        shell: bash
        run: |
          set -euo pipefail

          cd "$ANDROID_PROJECT"

          ./gradlew assembleFullRelease \
            --no-daemon \
            --stacktrace \
            2>&1 | tee "$LOG_OUTPUT/full-release.log"

      # ============================================================
      # 13. Build Legacy Release
      # ============================================================
      - name: 1️⃣3️⃣ Build Legacy Release
        shell: bash
        run: |
          set -euo pipefail

          cd "$ANDROID_PROJECT"

          ./gradlew assembleLegacyRelease \
            --no-daemon \
            --stacktrace \
            2>&1 | tee "$LOG_OUTPUT/legacy-release.log"

      # ============================================================
      # 14. Verify APK files
      # ============================================================
      - name: 1️⃣4️⃣ Verify APK Output
        shell: bash
        run: |
          set -euo pipefail

          echo "=================================================="
          echo "VERIFY APK OUTPUT"
          echo "=================================================="

          APK_ROOT="$ANDROID_PROJECT/app/build/outputs/apk"

          if [ ! -d "$APK_ROOT" ]; then
            echo "ERROR: APK output directory missing:"
            echo "$APK_ROOT"
            exit 1
          fi

          echo "APK output root:"
          echo "$APK_ROOT"

          APK_COUNT="$(
            find "$APK_ROOT" \
              -type f \
              -name "*.apk" \
              | wc -l
          )"

          echo "APK count: $APK_COUNT"

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "ERROR: No APK generated."
            exit 1
          fi

          find "$APK_ROOT" \
            -type f \
            -name "*.apk" \
            -print

      # ============================================================
      # 15. Locate and package APK
      #
      # IMPORTANT:
      # Do NOT use complicated Bash logic here.
      # Python performs all file discovery.
      # ============================================================
      - name: 1️⃣5️⃣ Locate Generated APK
        shell: bash
        run: |
          set -euo pipefail

          echo "=================================================="
          echo "LOCATE GENERATED APK"
          echo "=================================================="

          APK_ROOT="$ANDROID_PROJECT/app/build/outputs/apk"

          echo "APK output root:"
          echo "$APK_ROOT"

          python3 <<'PY'
          import json
          import os
          import shutil
          import zipfile
          from pathlib import Path

          apk_root = Path(os.environ["ANDROID_PROJECT"]) / "app" / "build" / "outputs" / "apk"
          release_dir = Path(os.environ["APK_OUTPUT"])

          release_dir.mkdir(parents=True, exist_ok=True)

          print("")
          print("Scanning APK files...")

          apks = sorted(
              p for p in apk_root.rglob("*.apk")
              if p.is_file()
          )

          print(f"发现 APK 数量：{len(apks)}")

          if not apks:
              raise SystemExit("ERROR: No APK files found.")

          manifest = []

          for apk in apks:
              size = apk.stat().st_size

              print(f"APK: {apk}")
              print(f"Size: {size} bytes")

              if size <= 1024:
                  raise SystemExit(
                      f"ERROR: APK appears invalid or empty: {apk}"
                  )

              try:
                  with zipfile.ZipFile(apk, "r") as zf:
                      bad = zf.testzip()

                  if bad is not None:
                      raise SystemExit(
                          f"ERROR: APK ZIP validation failed: {apk} -> {bad}"
                      )

              except zipfile.BadZipFile as exc:
                  raise SystemExit(
                      f"ERROR: Invalid APK ZIP: {apk}: {exc}"
                  )

              relative = apk.relative_to(apk_root)

              variant = apk.parent.name
              filename = apk.name

              if variant == "btc":
                  output_name = "BTC-Quant-btc-release.apk"
              elif variant == "full":
                  output_name = "BTC-Quant-full-release.apk"
              elif variant == "legacy":
                  output_name = "BTC-Quant-legacy-release.apk"
              else:
                  safe_name = filename.replace(" ", "-")
                  output_name = f"BTC-Quant-{safe_name}"

              destination = release_dir / output_name

              shutil.copy2(apk, destination)

              manifest.append({
                  "source": str(apk),
                  "relative": str(relative),
                  "output": str(destination),
                  "variant": variant,
                  "size": size,
                  "unsigned": "unsigned" in filename.lower()
              })

              print(f"Packaged: {destination}")

          manifest_file = release_dir / "apk-manifest.json"

          manifest_file.write_text(
              json.dumps(
                  manifest,
                  ensure_ascii=False,
                  indent=2
              ),
              encoding="utf-8"
          )

          print("")
          print("APK packaging completed.")
          print(f"Manifest: {manifest_file}")
          PY

          echo ""
          echo "Final release directory:"
          find "$APK_OUTPUT" -maxdepth 1 -type f -print

      # ============================================================
      # 16. APK final validation
      # ============================================================
      - name: 1️⃣6️⃣ Final APK Validation
        shell: bash
        run: |
          set -euo pipefail

          echo "=================================================="
          echo "FINAL APK VALIDATION"
          echo "=================================================="

          APK_COUNT="$(
            find "$APK_OUTPUT" \
              -maxdepth 1 \
              -type f \
              -name "*.apk" \
              | wc -l
          )"

          echo "Final APK count: $APK_COUNT"

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "ERROR: No packaged APK."
            exit 1
          fi

          while IFS= read -r apk; do
            echo ""
            echo "Checking:"
            echo "$apk"

            SIZE="$(stat -c%s "$apk")"

            echo "Size: $SIZE bytes"

            if [ "$SIZE" -le 1024 ]; then
              echo "ERROR: APK too small."
              exit 1
            fi

            unzip -t "$apk" >/dev/null

            echo "ZIP integrity: OK"

          done < <(
            find "$APK_OUTPUT" \
              -maxdepth 1 \
              -type f \
              -name "*.apk" \
              -print
          )

      # ============================================================
      # 17. Build summary
      # ============================================================
      - name: 1️⃣7️⃣ Build Summary
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          {
            echo "# BTC Quant APK Build"
            echo ""
            echo "## Build Status"
            echo ""
            echo "✅ Android compilation successful"
            echo "✅ APK generation successful"
            echo "✅ APK validation successful"
            echo ""
            echo "## Generated APK"
            echo ""

            while IFS= read -r apk; do
              size="$(stat -c%s "$apk")"
              echo "- $(basename "$apk") — ${size} bytes"
            done < <(
              find "$APK_OUTPUT" \
                -maxdepth 1 \
                -type f \
)
-name\
-name

回显“”
