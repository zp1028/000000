name: Build Release APK

on:
  workflow_dispatch:
    inputs:
      source_zip:
        description: "源码 ZIP 文件名，放在仓库根目录；留空则自动寻找"
        required: false
        default: ""

      gradle_task:
        description: "Gradle 构建任务"
        required: false
        default: "assembleRelease"

  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build-release-apk:

    name: Build Release APK

    runs-on: ubuntu-latest

    env:
      JAVA_VERSION: "17"
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8"
      GRADLE_USER_HOME: "${{ github.workspace }}/.gradle"

    steps:

      # ==========================================================
      # 1. Checkout
      # ==========================================================

      - name: "1️⃣ Checkout repository"
        uses: actions/checkout@v4


      # ==========================================================
      # 2. 显示环境
      # ==========================================================

      - name: "2️⃣ Show build environment"
        shell: bash
        run: |
          set +e

          echo "=================================================="
          echo "BUILD ENVIRONMENT"
          echo "=================================================="

          echo
          echo "Runner:"
          uname -a

          echo
          echo "Architecture:"
          uname -m

          echo
          echo "Java:"
          java -version 2>&1 || true

          echo
          echo "Workspace:"
          pwd

          echo
          echo "Repository files:"
          find . -maxdepth 3 -type f | sort | head -1000


      # ==========================================================
      # 3. JDK 17
      #
      # 注意：
      # 这里不能使用 cache: gradle
      #
      # 因为源码工程还在 ZIP 里面。
      # setup-java 会立即寻找 Gradle 文件，
      # 此时还没有解压，所以会导致：
      #
      # Error: No file ... matched to [**/*.gradle* ...]
      #
      # ==========================================================

      - name: "3️⃣ Setup JDK 17"
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"


      # ==========================================================
      # 4. 查找源码 ZIP
      # ==========================================================

      - name: "4️⃣ Find source ZIP"
        shell: bash
        run: |
          set -e

          INPUT_ZIP="${{ github.event.inputs.source_zip }}"

          echo "=================================================="
          echo "SEARCH SOURCE ZIP"
          echo "=================================================="

          ZIP=""


          # ----------------------------------------------------------
          # A. 用户指定 ZIP
          # ----------------------------------------------------------

          if [ -n "$INPUT_ZIP" ]; then

            if [ -f "$INPUT_ZIP" ]; then
              ZIP="$INPUT_ZIP"

            elif [ -f "./$INPUT_ZIP" ]; then
              ZIP="./$INPUT_ZIP"

            else

              echo "::error::指定的 ZIP 不存在：$INPUT_ZIP"

              echo
              echo "当前仓库 ZIP："

              find . \
                -maxdepth 3 \
                -type f \
                -iname "*.zip" \
                -print \
                | sort

              exit 1

            fi

          fi


          # ----------------------------------------------------------
          # B. 自动寻找 ZIP
          # ----------------------------------------------------------

          if [ -z "$ZIP" ]; then

            mapfile -t ZIP_FILES < <(
              find . \
                -maxdepth 3 \
                -type f \
                -iname "*.zip" \
                | sort
            )

            ZIP_COUNT="${#ZIP_FILES[@]}"


            if [ "$ZIP_COUNT" -eq 0 ]; then

              echo "::error::仓库中没有找到源码 ZIP"

              echo
              echo "当前仓库文件："

              find . \
                -maxdepth 4 \
                -type f \
                | sort \
                | head -1500

              exit 1

            fi


            if [ "$ZIP_COUNT" -eq 1 ]; then

              ZIP="${ZIP_FILES[0]}"

            else

              echo "发现多个 ZIP："

              printf '%s\n' "${ZIP_FILES[@]}"


              # 优先选择源码工程相关 ZIP
              ZIP=$(
                printf '%s\n' "${ZIP_FILES[@]}" \
                | grep -Ei \
                  "(source|project|caifenxi|android|app|release|fixed|merged)" \
                | head -1 \
                || true
              )


              if [ -z "$ZIP" ]; then
                ZIP="${ZIP_FILES[0]}"
              fi

            fi

          fi


          # ----------------------------------------------------------
          # C. 最终检查
          # ----------------------------------------------------------

          if [ -z "$ZIP" ] || [ ! -f "$ZIP" ]; then

            echo "::error::无法确定源码 ZIP"

            exit 1

          fi


          echo
          echo "最终源码 ZIP："
          echo "$ZIP"

          echo
          echo "ZIP 大小："
          du -h "$ZIP"

          echo
          echo "ZIP SHA256："
          sha256sum "$ZIP"


          echo "SOURCE_ZIP=$ZIP" >> "$GITHUB_ENV"


      # ==========================================================
      # 5. ZIP 完整性检查
      # ==========================================================

      - name: "5️⃣ Validate ZIP"
        shell: bash
        run: |
          set -e

          echo "=================================================="
          echo "ZIP VALIDATION"
          echo "=================================================="

          echo "检查：$SOURCE_ZIP"

          if ! unzip -t "$SOURCE_ZIP"; then

            echo "::error::ZIP 文件损坏或无法正常读取"

            exit 1

          fi

          echo
          echo "✅ ZIP 完整性检查通过"


      # ==========================================================
      # 6. 解压源码
      # ==========================================================

      - name: "6️⃣ Extract source ZIP"
        shell: bash
        run: |
          set -e

          rm -rf build_source
          rm -rf android_project

          mkdir -p build_source
          mkdir -p android_project

          echo "=================================================="
          echo "EXTRACT SOURCE ZIP"
          echo "=================================================="

          echo "解压：$SOURCE_ZIP"

          if ! unzip -q "$SOURCE_ZIP" -d build_source; then

            echo "::error::ZIP 解压失败"

            echo
            echo "尝试完整解压测试："

            unzip -t "$SOURCE_ZIP" || true

            exit 1

          fi


          echo
          echo "✅ ZIP 解压完成"


          echo
          echo "解压后的目录："

          find build_source \
            -maxdepth 8 \
            -print \
            | sort \
            | head -3000


      # ==========================================================
      # 7. 扫描 Android 工程候选
      # ==========================================================

      - name: "7️⃣ Scan Android project candidates"
        shell: bash
        run: |
          set -e

          echo "=================================================="
          echo "SCAN ANDROID PROJECT CANDIDATES"
          echo "=================================================="


          CANDIDATES="$GITHUB_WORKSPACE/project_candidates.txt"

          rm -f "$CANDIDATES"

          touch "$CANDIDATES"


          # ----------------------------------------------------------
          # settings.gradle
          # ----------------------------------------------------------

          find build_source \
            -type f \
            \( \
              -name "settings.gradle" \
              -o \
              -name "settings.gradle.kts" \
            \) \
            -print \
            | while IFS= read -r FILE; do

                dirname "$FILE"

              done \
            >> "$CANDIDATES"


          # ----------------------------------------------------------
          # gradlew
          # ----------------------------------------------------------

          find build_source \
            -type f \
            -name "gradlew" \
            -print \
            | while IFS= read -r FILE; do

                dirname "$FILE"

              done \
            >> "$CANDIDATES"


          # ----------------------------------------------------------
          # build.gradle
          # ----------------------------------------------------------

          find build_source \
            -type f \
            \( \
              -name "build.gradle" \
              -o \
              -name "build.gradle.kts" \
            \) \
            -print \
            | while IFS= read -r FILE; do

                dirname "$FILE"

              done \
            >> "$CANDIDATES"


          # ----------------------------------------------------------
          # AndroidManifest
          # ----------------------------------------------------------

          find build_source \
            -type f \
            -name "AndroidManifest.xml" \
            -print \
            | while IFS= read -r FILE; do

                DIR=$(dirname "$FILE")

                # 如果是 app/src/main/AndroidManifest.xml
                if [[ "$DIR" == */src/main ]]; then
                  dirname "$(dirname "$DIR")"
                fi

              done \
            >> "$CANDIDATES"


          # ----------------------------------------------------------
          # 去重
          # ----------------------------------------------------------

          sort -u "$CANDIDATES" \
            -o "$CANDIDATES"


          echo
          echo "候选工程目录："

          cat "$CANDIDATES"


          if [ ! -s "$CANDIDATES" ]; then

            echo "::error::没有找到 Android/Gradle 工程"

            echo
            echo "解压后的文件："

            find build_source \
              -maxdepth 10 \
              -type f \
              | sort \
              | head -5000

            exit 1

          fi


      # ==========================================================
      # 8. 工程候选评分
      # ==========================================================

      - name: "8️⃣ Score project candidates"
        shell: bash
        run: |
          set -e

          echo "=================================================="
          echo "SCORE ANDROID PROJECTS"
          echo "=================================================="


          BEST_ROOT=""
          BEST_SCORE=-1

          REPORT="$GITHUB_WORKSPACE/project-detection-report.txt"

          rm -f "$REPORT"

          touch "$REPORT"


          while IFS= read -r ROOT; do

            [ -z "$ROOT" ] && continue

            SCORE=0


            # --------------------------------------------------------
            # settings.gradle
            # --------------------------------------------------------

            if [ -f "$ROOT/settings.gradle" ]; then
              SCORE=$((SCORE + 50))
            fi

            if [ -f "$ROOT/settings.gradle.kts" ]; then
              SCORE=$((SCORE + 50))
            fi


            # --------------------------------------------------------
            # Gradle Wrapper
            # --------------------------------------------------------

            if [ -f "$ROOT/gradlew" ]; then
              SCORE=$((SCORE + 30))
            fi

            if [ -f "$ROOT/gradle/wrapper/gradle-wrapper.properties" ]; then
              SCORE=$((SCORE + 20))
            fi


            # --------------------------------------------------------
            # Root build.gradle
            # --------------------------------------------------------

            if [ -f "$ROOT/build.gradle" ]; then
              SCORE=$((SCORE + 20))
            fi

            if [ -f "$ROOT/build.gradle.kts" ]; then
              SCORE=$((SCORE + 20))
            fi


            # --------------------------------------------------------
            # app module
            # --------------------------------------------------------

            if [ -d "$ROOT/app" ]; then
              SCORE=$((SCORE + 30))
            fi

            if [ -f "$ROOT/app/build.gradle" ]; then
              SCORE=$((SCORE + 30))
            fi

            if [ -f "$ROOT/app/build.gradle.kts" ]; then
              SCORE=$((SCORE + 30))
            fi


            # --------------------------------------------------------
            # Android Manifest
            # --------------------------------------------------------

            if [ -f "$ROOT/app/src/main/AndroidManifest.xml" ]; then
              SCORE=$((SCORE + 30))
            fi


            # --------------------------------------------------------
            # Android source
            # --------------------------------------------------------

            if [ -d "$ROOT/app/src/main" ]; then
              SCORE=$((SCORE + 20))
            fi


            # --------------------------------------------------------
            # gradle.properties
            # --------------------------------------------------------

            if [ -f "$ROOT/gradle.properties" ]; then
              SCORE=$((SCORE + 10))
            fi


            # --------------------------------------------------------
            # Kotlin
            # --------------------------------------------------------

            if find "$ROOT/app/src" \
              -type f \
              -name "*.kt" \
              2>/dev/null \
              | grep -q .; then

              SCORE=$((SCORE + 10))

            fi


            # --------------------------------------------------------
            # Java
            # --------------------------------------------------------

            if find "$ROOT/app/src" \
              -type f \
              -name "*.java" \
              2>/dev/null \
              | grep -q .; then

              SCORE=$((SCORE + 5))

            fi


            # --------------------------------------------------------
            # 输出
            # --------------------------------------------------------

            echo
            echo "------------------------------------------"
            echo "Candidate:"
            echo "$ROOT"
            echo "Score:"
            echo "$SCORE"


            {
              echo "Candidate: $ROOT"
              echo "Score: $SCORE"
              echo

            } >> "$REPORT"


            # --------------------------------------------------------
            # 选择最高分
            # --------------------------------------------------------

            if [ "$SCORE" -gt "$BEST_SCORE" ]; then

              BEST_SCORE="$SCORE"
              BEST_ROOT="$ROOT"

            fi

          done < "$CANDIDATES"


          echo
          echo "=================================================="
          echo "SELECTED PROJECT"
          echo "=================================================="


          echo "Root:"
          echo "$BEST_ROOT"

          echo
          echo "Score:"
          echo "$BEST_SCORE"


          if [ -z "$BEST_ROOT" ]; then

            echo "::error::无法确定 Android 工程根目录"

            exit 1

          fi


          if [ "$BEST_SCORE" -lt 70 ]; then

            echo "::warning::工程评分低于 70，可能不是完整 Android 工程"

          fi


          echo "DETECTED_ROOT=$BEST_ROOT" >> "$GITHUB_ENV"
          echo "DETECTED_SCORE=$BEST_SCORE" >> "$GITHUB_ENV"


      # ==========================================================
      # 9. 自动整理工程根目录
      # ==========================================================

      - name: "9️⃣ Normalize Android project root"
        shell: bash
        run: |
          set -e

          echo "=================================================="
          echo "NORMALIZE ANDROID PROJECT"
          echo "=================================================="


          rm -rf android_project

          mkdir -p android_project


          ROOT="$DETECTED_ROOT"

          REAL_ROOT="$ROOT"


          echo "检测根目录："
          echo "$ROOT"


          # ----------------------------------------------------------
          # 检查更深层工程
          # ----------------------------------------------------------

          INNER_SETTINGS=$(
            find "$ROOT" \
              -mindepth 1 \
              -type f \
              \( \
                -name "settings.gradle" \
                -o \
                -name "settings.gradle.kts" \
              \) \
              | head -1 \
              || true
          )


          if [ -n "$INNER_SETTINGS" ]; then

            INNER_ROOT=$(dirname "$INNER_SETTINGS")


            if [ -f "$INNER_ROOT/gradlew" ] || \
               [ -f "$INNER_ROOT/build.gradle" ] || \
               [ -f "$INNER_ROOT/build.gradle.kts" ]; then

              REAL_ROOT="$INNER_ROOT"

            fi

          fi


          echo
          echo "最终工程根目录："
          echo "$REAL_ROOT"


          # ----------------------------------------------------------
          # 复制工程
          # ----------------------------------------------------------

          cp -a "$REAL_ROOT"/. android_project/


          # ----------------------------------------------------------
          # 删除旧构建缓存
          # ----------------------------------------------------------

          rm -rf android_project/.gradle
          rm -rf android_project/build
          rm -rf android_project/app/build


          # ----------------------------------------------------------
          # 修复 gradlew 权限
          # ----------------------------------------------------------

          if [ -f android_project/gradlew ]; then

            chmod +x android_project/gradlew

            echo
            echo "✅ gradlew 执行权限已修复"

          fi


          echo "PROJECT_ROOT=$GITHUB_WORKSPACE/android_project" \
            >> "$GITHUB_ENV"


          echo
          echo "=================================================="
          echo "NORMALIZED PROJECT STRUCTURE"
          echo "=================================================="


          find android_project \
            -maxdepth 5 \
            -print \
            | sort \
            | head -4000


      # ==========================================================
      # 10. 最终工程验证
      # ==========================================================

      - name: "🔟 Validate normalized Android project"
        shell: bash
        run: |
          set -e

          cd "$PROJECT_ROOT"


          echo "=================================================="
          echo "FINAL PROJECT VALIDATION"
          echo "=================================================="


          echo
          echo "Project root:"
          pwd


          echo
          echo "Root files:"
          ls -la


          # ----------------------------------------------------------
          # settings
          # ----------------------------------------------------------

          if [ -f "settings.gradle" ]; then

            echo "✅ settings.gradle"

          elif [ -f "settings.gradle.kts" ]; then

            echo "✅ settings.gradle.kts"

          else

            echo "::error::❌ 缺少 settings.gradle / settings.gradle.kts"

            exit 1

          fi


          # ----------------------------------------------------------
          # root build
          # ----------------------------------------------------------

          if [ -f "build.gradle" ] || \
             [ -f "build.gradle.kts" ]; then

            echo "✅ Root build.gradle"

          else

            echo "::warning::⚠️ Root build.gradle 不存在"

          fi


          # ----------------------------------------------------------
          # app
          # ----------------------------------------------------------

          if [ -d "app" ]; then

            echo "✅ app module"

          else

            echo "::warning::⚠️ 没有发现 app module"

          fi


          # ----------------------------------------------------------
          # manifest
          # ----------------------------------------------------------

          if [ -f "app/src/main/AndroidManifest.xml" ]; then

            echo "✅ AndroidManifest.xml"

          else

            echo "::warning::⚠️ 没有发现 AndroidManifest.xml"

          fi


          # ----------------------------------------------------------
          # gradlew
          # ----------------------------------------------------------

          if [ -f "gradlew" ]; then

            chmod +x gradlew

            echo
            echo "Gradle Wrapper："

            ./gradlew --version

          else

            echo "::warning::⚠️ gradlew 不存在"

            if ! command -v gradle >/dev/null 2>&1; then

              echo "::error::gradlew 和系统 Gradle 均不存在"

              exit 1

            fi

            echo
            echo "系统 Gradle："

            gradle --version

          fi


      # ==========================================================
      # 11. 配置 Gradle Cache
      #
      # 注意：
      # 现在才启用缓存。
      #
      # 因为现在 android_project 已经存在 Gradle 文件。
      # ==========================================================

      - name: "1️⃣1️⃣ Setup Gradle cache"
        shell: bash
        run: |
          set -e

          echo "=================================================="
          echo "SETUP GRADLE CACHE"
          echo "=================================================="


          mkdir -p "$GRADLE_USER_HOME"


          echo "Gradle User Home:"
          echo "$GRADLE_USER_HOME"


          echo
          echo "Gradle files:"


          find "$PROJECT_ROOT" \
            -type f \
            \( \
              -name "settings.gradle" \
              -o \
              -name "settings.gradle.kts" \
              -o \
              -name "build.gradle" \
              -o \
              -name "build.gradle.kts" \
              -o \
              -name "gradle-wrapper.properties" \
            \) \
            | sort


      # ==========================================================
      # 12. Gradle 配置分析
      # ==========================================================

      - name: "1️⃣2️⃣ Analyze Gradle configuration"
        shell: bash
        run: |
          set +e

          cd "$PROJECT_ROOT"


          echo "=================================================="
          echo "GRADLE CONFIGURATION"
          echo "=================================================="


          echo
          echo "Java:"
          java -version


          echo
          echo "Gradle:"
          if [ -f "./gradlew" ]; then
            ./gradlew --version
          else
            gradle --version
          fi


          echo
          echo "Gradle Wrapper:"
          cat gradle/wrapper/gradle-wrapper.properties 2>/dev/null || true


          echo
          echo "Gradle properties:"
          cat gradle.properties 2>/dev/null || true


          echo
          echo "Settings:"
          if [ -f settings.gradle.kts ]; then
            sed -n '1,300p' settings.gradle.kts
          elif [ -f settings.gradle ]; then
            sed -n '1,300p' settings.gradle
          fi


      # ==========================================================
      # 13. Gradle Clean
      # ==========================================================

      - name: "1️⃣3️⃣ Gradle clean"
        shell: bash
        run: |
          set -o pipefail

          cd "$PROJECT_ROOT"


          echo "=================================================="
          echo "GRADLE CLEAN"
          echo "=================================================="


          if [ -f "./gradlew" ]; then

            ./gradlew clean \
              --stacktrace \
              --no-daemon \
              2>&1 \
              | tee "$GITHUB_WORKSPACE/gradle-clean.log"

          else

            gradle clean \
              --stacktrace \
              --no-daemon \
              2>&1 \
              | tee "$GITHUB_WORKSPACE/gradle-clean.log"

          fi


      # ==========================================================
      # 14. Release 构建
      # ==========================================================

      - name: "1️⃣4️⃣ Build Release APK"
        id: release_build
        shell: bash
        run: |
          set -o pipefail

          cd "$PROJECT_ROOT"


          TASK="${{ github.event.inputs.gradle_task }}"


          if [ -z "$TASK" ]; then
            TASK="assembleRelease"
          fi


          echo "=================================================="
          echo "BUILD RELEASE APK"
          echo "=================================================="


          echo
          echo "Project:"
          pwd


          echo
          echo "Task:"
          echo "$TASK"


          echo
          echo "JDK:"
          java -version


          echo
          echo "Gradle:"
          if [ -f "./gradlew" ]; then
            ./gradlew --version
          else
            gradle --version
          fi


          echo
          echo "开始正式构建..."


          if [ -f "./gradlew" ]; then

            ./gradlew "$TASK" \
              --stacktrace \
              --info \
              --no-daemon \
              2>&1 \
              | tee "$GITHUB_WORKSPACE/gradle-build.log"

          else

            gradle "$TASK" \
              --stacktrace \
              --info \
              --no-daemon \
              2>&1 \
              | tee "$GITHUB_WORKSPACE/gradle-build.log"

          fi


      # ==========================================================
      # 15. 构建失败自动分析
      # ==========================================================

      - name: "1️⃣5️⃣ Analyze build failure"
        if: failure()
        shell: bash
        run: |
          set +e


          LOG="$GITHUB_WORKSPACE/gradle-build.log"


          echo "=================================================="
          echo "BUILD FAILURE ANALYSIS"
          echo "=================================================="


          if [ ! -f "$LOG" ]; then

            echo "::error::没有找到 gradle-build.log"

            exit 0

          fi


          # ========================================================
          # 1. 总体 FAILURE
          # ========================================================

          echo
          echo "=================================================="
          echo "1. FAILURE"
          echo "=================================================="


          grep -nE \
            "FAILURE:|What went wrong:|Execution failed|BUILD FAILED" \
            "$LOG" \
            | tail -80 \
            || true


          # ========================================================
          # 2. Kotlin
          # ========================================================

          echo
          echo "=================================================="
          echo "2. KOTLIN ERRORS"
          echo "=================================================="


          grep -nE \
            "e: .*\.kt:|Unresolved reference|Type mismatch|Expecting|Cannot infer|Unresolved" \
            "$LOG" \
            | tail -150 \
            || true


          # ========================================================
          # 3. Java
          # ========================================================

          echo
          echo "=================================================="
          echo "3. JAVA ERRORS"
          echo "=================================================="


          grep -nE \
            "error: .*\.java:|cannot find symbol|package .* does not exist" \
            "$LOG" \
            | tail -150 \
            || true


          # ========================================================
          # 4. Gradle dependencies
          # ========================================================

          echo
          echo "=================================================="
          echo "4. GRADLE DEPENDENCY ERRORS"
          echo "=================================================="


          grep -niE \
            "Could not resolve|Could not find|Could not GET|Could not HEAD|Failed to resolve|Connection timed out" \
            "$LOG" \
            | tail -150 \
            || true


          # ========================================================
          # 5. AGP / Gradle
          # ========================================================

          echo
          echo "=================================================="
          echo "5. AGP / GRADLE VERSION ERRORS"
          echo "=================================================="


          grep -niE \
            "Minimum supported Gradle|requires Gradle|Plugin.*was not found|plugin.*not found|Android Gradle Plugin|AGP" \
            "$LOG" \
            | tail -150 \
            || true


          # ========================================================
          # 6. Manifest
          # ========================================================

          echo
          echo "=================================================="
          echo "6. MANIFEST ERRORS"
          echo "=================================================="


          grep -niE \
            "Manifest merger failed|AndroidManifest|manifest merger" \
            "$LOG" \
            | tail -150 \
            || true


          # ========================================================
          # 7. AAPT / Resources
          # ========================================================

          echo
          echo "=================================================="
          echo "7. AAPT / RESOURCE ERRORS"
          echo "=================================================="


          grep -niE \
            "AAPT|resource .* not found|error: resource|XML.*error" \
            "$LOG" \
            | tail -150 \
            || true


          # ===================================================
