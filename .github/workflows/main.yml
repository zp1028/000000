      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        id: build
        run: |
          set -euo pipefail

          # 定位工程根目录（支持 ZIP 解压后嵌套一层）
          ROOT=""
          if [ -f settings.gradle.kts ] || [ -f settings.gradle ]; then
            ROOT="."
          else
            FOUND=$(find . -maxdepth 3 \( -name settings.gradle.kts -o -name settings.gradle \) 2>/dev/null | head -1 || true)
            if [ -n "$FOUND" ]; then
              ROOT=$(dirname "$FOUND")
            fi
          fi

          if [ -z "$ROOT" ]; then
            echo "❌ 未找到 settings.gradle / settings.gradle.kts"
            find . -maxdepth 3 -type f -name "settings.gradle*" || true
            exit 1
          fi

          echo "✅ 工程根目录: $ROOT"
          cd "$ROOT"

          # 清理本工程 Gradle 缓存（不要清全局 \~/.gradle，避免每次全量下载）
          rm -rf .gradle

          if [ -f ./gradlew ]; then
            sed -i 's/\r$//' ./gradlew || true
            chmod +x ./gradlew
            ./gradlew --no-daemon clean assembleDebug --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/gradle-build.log"
          else
            gradle --no-daemon clean assembleDebug --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/gradle-build.log"
          fi

