name: Complete APK Build

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # ============================================================
      # 1. 检出代码
      # ============================================================
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ============================================================
      # 2. 解压源码 ZIP
      # ============================================================
      - name: Extract Source ZIP
        shell: bash
        run: |
          set -euo pipefail

          echo "📦 查找源码压缩包..."
          ZIP_FILE="$(find . -maxdepth 2 -name '*.zip' -not -path './.git/*' -print -quit || true)"

          if [ -z "${ZIP_FILE:-}" ]; then
            echo "ℹ️ 未找到 zip，假设源码已直接存在于仓库"
            ls -la
            exit 0
          fi

          echo "✅ 找到压缩包: $ZIP_FILE"

          TMP_DIR="$(mktemp -d)"
          echo "📂 解压到临时目录: $TMP_DIR"
          unzip -q -o "$ZIP_FILE" -d "$TMP_DIR"

          SETTINGS_FILE="$(
            find "$TMP_DIR" -maxdepth 3 \
              \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) \
              -print -quit
          )"

          if [ -z "${SETTINGS_FILE:-}" ]; then
            echo "❌ 解压后仍找不到 settings.gradle(.kts)"
            find "$TMP_DIR" -maxdepth 4 -type f | sort | head -50
            exit 1
          fi

          SRC_ROOT="$(dirname "$SETTINGS_FILE")"
          echo "✅ 源码根目录: $SRC_ROOT"

          cp -a "$SRC_ROOT"/. .
          echo "📂 仓库根目录内容："
          ls -la

      # ============================================================
      # 3. 定位项目根目录
      # ============================================================
      - name: Locate Project Root
        id: locate_root
        shell: bash
        run: |
          set -euo pipefail
          echo "🔍 查找 settings.gradle(.kts)..."

          if [ -f settings.gradle.kts ] || [ -f settings.gradle ]; then
            ROOT="."
          else
            FOUND="$(find . -maxdepth 4 \
              \( -name settings.gradle.kts -o -name settings.gradle \) \
              -not -path './.git/*' -print -quit || true)"

            if [ -z "${FOUND:-}" ]; then
              echo "❌ 找不到 settings.gradle(.kts)"
              find . -path ./.git -prune -o -type f -print | sort | head -80
              exit 1
            fi
            ROOT="$(dirname "$FOUND")"
          fi

          ROOT="$(cd "$ROOT" && pwd)"
          echo "root=$ROOT" >> "$GITHUB_OUTPUT"
          echo "✅ 项目根目录: $ROOT"

      # ============================================================
      # 4. 把阿里云镜像替换成官方源（修复 KSP 插件解析失败）
      # ============================================================
      - name: Patch Gradle Repositories
        shell: bash
        run: |
          set -euo pipefail
          ROOT="${{ steps.locate_root.outputs.root }}"
          cd "$ROOT"

          FILE="settings.gradle.kts"
          [ -f "$FILE" ] || FILE="settings.gradle"
          [ -f "$FILE" ] || { echo "❌ 找不到 settings.gradle(.kts)"; exit 1; }

          echo "📝 目标文件: $FILE"
          echo "🔎 修改前："
          grep -n "aliyun\|google()\|mavenCentral\|gradlePluginPortal" "$FILE" || true

          cp "$FILE" "$FILE.ci-backup"

          sed -i \
            -e 's|https://maven.aliyun.com/repository/google|https://maven.google.com|g' \
            -e 's|https://maven.aliyun.com/repository/gradle-plugin|https://plugins.gradle.org/m2|g' \
            -e 's|https://maven.aliyun.com/repository/central|https://repo.maven.apache.org/maven2|g' \
            -e 's|https://maven.aliyun.com/repository/public|https://repo.maven.apache.org/maven2|g' \
            "$FILE"

          echo ""
          echo "🔎 修改后："
          grep -n "maven.google\|plugins.gradle.org\|repo.maven.apache\|aliyun" "$FILE" || true

      # ============================================================
      # 5. 校验源码结构
      # ============================================================
      - name: Validate Source
        shell: bash
        run: |
          set -euo pipefail
          ROOT="${{ steps.locate_root.outputs.root }}"
          cd "$ROOT"

          echo "🔎 校验源码..."
          { test -f "settings.gradle.kts" || test -f "settings.gradle"; } \
            || { echo "❌ 缺少 settings.gradle(.kts)"; exit 1; }
          test -f "gradlew" || { echo "❌ 缺少 gradlew"; exit 1; }
          [ -d "app/src/main" ] || { echo "❌ app/src/main 不存在"; exit 1; }
          find app/src/main -name "AndroidManifest.xml" -type f | grep -q . \
            || { echo "❌ AndroidManifest.xml 不存在"; exit 1; }
          echo "✅ 源码结构 OK"

      # ============================================================
      # 6. JDK 17
      # ============================================================
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # ============================================================
      # 7. 手动准备 Android SDK
      # ============================================================
      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          export ANDROID_HOME="$SDK_ROOT"
          export ANDROID_SDK_ROOT="$SDK_ROOT"

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

          mkdir -p "$SDK_ROOT/licenses"
          printf '%s\n' \
            8933bad161af4178b1185d1a37fbf41ea5269c55 \
            d56f5187479451eabf01fb78af6dfcb131a6481e \
            24333f8a63b6825ea9c5514f83c2829b004d1fee \
            84831b9409646a918e30573bab4c9c91346d8abd \
            > "$SDK_ROOT/licenses/android-sdk-license"

          SDKMANAGER="$(command -v sdkmanager || true)"
          [ -n "$SDKMANAGER" ] || SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -path '*/bin/sdkmanager' -print -quit)"
          [ -n "$SDKMANAGER" ] || { echo "❌ sdkmanager 未找到"; exit 1; }
          echo "✅ sdkmanager: $SDKMANAGER"

          "$SDKMANAGER" --sdk_root="$SDK_ROOT" \
            "platform-tools" \
            "platforms;android-35" \
            "platforms;android-34" \
            "build-tools;35.0.0" \
            "build-tools;34.0.0"

          echo "✅ Android SDK 准备完成"

      # ============================================================
      # 8. 验证构建环境
      # ============================================================
      - name: Verify Build Environment
        shell: bash
        run: |
          set -euo pipefail
          ROOT="${{ steps.locate_root.outputs.root }}"
          cd "$ROOT"
          chmod +x gradlew

          echo "☕ Java:"; java -version
          echo ""; echo "🤖 ANDROID_HOME=${ANDROID_HOME:-}"
          echo ""; echo "📦 Gradle wrapper:"; ./gradlew --version || true

      # ============================================================
      # 9. Clean
      # ============================================================
      - name: Clean Project
        shell: bash
        run: |
          set -euo pipefail
          ROOT="${{ steps.locate_root.outputs.root }}"
          cd "$ROOT"
          chmod +x gradlew
          echo "🧹 Clean..."
          ./gradlew clean --no-daemon --stacktrace
          echo "✅ Clean 完成"

      # ============================================================
      # 10. 构建 Debug APK
      # ============================================================
      - name: Build Debug APK
        id: build_apk
        shell: bash
        run: |
          set -uo pipefail
          ROOT="${{ steps.locate_root.outputs.root }}"
          cd "$ROOT"
          chmod +x gradlew

          echo "========================================"
          echo "🔨 构建 Debug APK"
          echo "========================================"
          echo "工作目录: $(pwd)"
          echo ""

          set +e
          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace \
            2>&1 | tee /tmp/gradle-build.log | tail -200
          BUILD_EXIT=${PIPESTATUS[0]}
          set -e

          if [ "$BUILD_EXIT" -eq 0 ]; then
            echo "✅ APK 构建成功"
            echo "build_success=true" >> "$GITHUB_OUTPUT"
          else
            echo "❌ APK 构建失败 (exit=$BUILD_EXIT)"
            echo "===== 最后 200 行日志 ====="
            tail -200 /tmp/gradle-build.log || true
            echo "build_success=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      # ============================================================
      # 11. 定位 APK
      # ============================================================
      - name: Locate APK
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          ROOT="${{ steps.locate_root.outputs.root }}"
          cd "$ROOT"

          APK_COUNT="$(find . -type f -path '*/build/outputs/apk/debug/*.apk' | wc -l)"
          [ "$APK_COUNT" -eq 0 ] && { echo "❌ 没有找到 Debug APK"; exit 1; }

          echo "✅ 找到 $APK_COUNT 个 APK："
          find . -type f -path '*/build/outputs/apk/debug/*.apk' -print -exec ls -lh {} \;

      # ============================================================
      # 12. 上传 APK
      # ============================================================
      - name: Upload Debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BTC-Quant-debug-apk
          path: |
            **/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      # ============================================================
      # 13. 上传构建报告
      # ============================================================
      - name: Upload Build Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BTC-Quant-build-reports
          path: |
            **/build/reports/**
            **/build/outputs/logs/**
          if-no-files-found: ignore
          retention-days: 7

      # ============================================================
      # 14. 构建摘要
      # ============================================================
      - name: Build Summary
        if: always()
        shell: bash
        run: |
          echo "## 📊 BTC Quant APK Build" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Build Information" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Time:** $(date '+%Y-%m-%d %H:%M:%S UTC')" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Actor:** ${{ github.actor }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Branch:** ${{ github.ref_name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Commit:** ${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **JDK:** 17" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          if [ "${{ steps.build_apk.outputs.build_success }}" = "true" ]; then
            echo "### ✅ BUILD SUCCESS" >> "$GITHUB_STEP_SUMMARY"
            echo "Debug APK: \`BTC-Quant-debug-apk\`" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### ❌ BUILD FAILED" >> "$GITHUB_STEP_SUMMARY"
            echo "查看 Gradle 日志与上传的报告。" >> "$GITHUB_STEP_SUMMARY"
          fi
