name: BTC Quant - Build Release APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build BTC Quant APK
    runs-on: ubuntu-latest

    env:
      ANDROID_PROJECT: ${{ github.workspace }}/android_project
      APK_OUTPUT: ${{ github.workspace }}/release
      LOG_OUTPUT: ${{ github.workspace }}/build_logs

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate source ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE=""

          while IFS= read -r -d '' file; do
            ZIP_FILE="$file"
            break
          done < <(
            find "$GITHUB_WORKSPACE" \
              -maxdepth 3 \
              -type f \
              -name '*.zip' \
              -print0
          )

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No source ZIP found."
            exit 1
          fi

          echo "Source ZIP: $ZIP_FILE"
          echo "SOURCE_ZIP=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Prepare build directories
        shell: bash
        run: |
          set -euo pipefail

          rm -rf \
            "$ANDROID_PROJECT" \
            "$APK_OUTPUT" \
            "$LOG_OUTPUT" \
            "$GITHUB_WORKSPACE/source"

          mkdir -p \
            "$ANDROID_PROJECT" \
            "$APK_OUTPUT" \
            "$LOG_OUTPUT" \
            "$GITHUB_WORKSPACE/source"

      - name: Extract source
        shell: bash
        run: |
          set -euo pipefail

          unzip -q \
            "$SOURCE_ZIP" \
            -d "$GITHUB_WORKSPACE/source"

          echo "Source extracted."

      - name: Detect Android project
        shell: bash
        run: |
          set -euo pipefail

          BEST_ROOT=""
          BEST_SCORE=-1

          while IFS= read -r -d '' settings_file; do

            candidate="$(dirname "$settings_file")"
            score=0

            if [ -f "$candidate/settings.gradle" ]; then
              score=$((score + 20))
            fi

            if [ -f "$candidate/settings.gradle.kts" ]; then
              score=$((score + 20))
            fi

            if [ -f "$candidate/build.gradle" ]; then
              score=$((score + 20))
            fi

            if [ -f "$candidate/build.gradle.kts" ]; then
              score=$((score + 20))
            fi

            if [ -x "$candidate/gradlew" ]; then
              score=$((score + 30))
            fi

            if [ -d "$candidate/app" ]; then
              score=$((score + 30))
            fi

            echo "Candidate: $candidate"
            echo "Score: $score"

            if [ "$score" -gt "$BEST_SCORE" ]; then
              BEST_ROOT="$candidate"
              BEST_SCORE="$score"
            fi

          done < <(
            find "$GITHUB_WORKSPACE/source" \
              -type f \
              \( \
                -name 'settings.gradle' \
                -o -name 'settings.gradle.kts' \
              \) \
              -print0
          )

          if [ -z "$BEST_ROOT" ]; then
            echo "ERROR: Android project root not found."
            exit 1
          fi

          echo "Selected project:"
          echo "$BEST_ROOT"

          cp -a \
            "$BEST_ROOT"/. \
            "$ANDROID_PROJECT"/

          echo "DETECTED_ROOT=$BEST_ROOT" >> "$GITHUB_ENV"

      - name: Validate Android project
        shell: bash
        run: |
          set -euo pipefail

          cd "$ANDROID_PROJECT"

          if [ ! -f settings.gradle ] && \
             [ ! -f settings.gradle.kts ]; then
            echo "ERROR: settings.gradle(.kts) missing."
            exit 1
          fi

          if [ ! -f build.gradle ] && \
             [ ! -f build.gradle.kts ]; then
            echo "ERROR: root build.gradle(.kts) missing."
            exit 1
          fi

          if [ ! -d app ]; then
            echo "ERROR: app directory missing."
            exit 1
          fi

          echo "Android project structure OK."

      - name: Repair Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail

          cd "$ANDROID_PROJECT"

          NEED_REPAIR=0

          if [ ! -x ./gradlew ]; then
            NEED_REPAIR=1
          fi

          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            NEED_REPAIR=1
          fi

          if [ "$NEED_REPAIR" -eq 0 ]; then
            echo "Gradle wrapper is complete."
            exit 0
          fi

          DISTRIBUTION_URL=""

          if [ -f gradle/wrapper/gradle-wrapper.properties ]; then
            DISTRIBUTION_URL="$(
              grep '^distributionUrl=' \
                gradle/wrapper/gradle-wrapper.properties |
              head -1 |
              cut -d'=' -f2-
            )"
          fi

          if [ -z "$DISTRIBUTION_URL" ]; then
            DISTRIBUTION_URL="https://services.gradle.org/distributions/gradle-8.9-bin.zip"
          fi

          GRADLE_VERSION="$(
            printf '%s\n' "$DISTRIBUTION_URL" |
            sed -n 's/.*gradle-\([0-9][0-9.]*\)-.*/\1/p'
          )"

          if [ -z "$GRADLE_VERSION" ]; then
            GRADLE_VERSION="8.9"
          fi

          echo "Using Gradle $GRADLE_VERSION"

          mkdir -p "$HOME/gradle"

          curl \
            -L \
            --fail \
            --retry 3 \
            -o "$HOME/gradle/gradle.zip" \
            "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip"

          rm -rf \
            "$HOME/gradle/gradle-${GRADLE_VERSION}"

          unzip -q \
            "$HOME/gradle/gradle.zip" \
            -d "$HOME/gradle"

          GRADLE_BIN="$HOME/gradle/gradle-${GRADLE_VERSION}/bin/gradle"

          if [ ! -x "$GRADLE_BIN" ]; then
            echo "ERROR: Gradle executable not found."
            exit 1
          fi

          "$GRADLE_BIN" --version

          "$GRADLE_BIN" \
            wrapper \
            --gradle-version "$GRADLE_VERSION"

          chmod +x ./gradlew

          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "ERROR: gradle-wrapper.jar still missing."
            exit 1
          fi

          echo "Gradle wrapper repaired."

      - name: Validate Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail

          cd "$ANDROID_PROJECT"

          ./gradlew --version

      - name: Clean build
        shell: bash
        run: |
          set -euo pipefail

          cd "$ANDROID_PROJECT"

          ./gradlew \
            clean \
            --no-daemon \
            --stacktrace \
            2>&1 | tee "$LOG_OUTPUT/clean.log"

      - name: Build BTC release
        shell: bash
        run: |
          set -euo pipefail

          cd "$ANDROID_PROJECT"

          ./gradlew \
            assembleBtcRelease \
            --no-daemon \
            --stacktrace \
            2>&1 | tee "$LOG_OUTPUT/btc-release.log"

      - name: Build Full release
        shell: bash
        run: |
          set -euo pipefail

          cd "$ANDROID_PROJECT"

          ./gradlew \
            assembleFullRelease \
            --no-daemon \
            --stacktrace \
            2>&1 | tee "$LOG_OUTPUT/full-release.log"

      - name: Build Legacy release
        shell: bash
        run: |
          set -euo pipefail

          cd "$ANDROID_PROJECT"

          ./gradlew \
            assembleLegacyRelease \
            --no-daemon \
            --stacktrace \
            2>&1 | tee "$LOG_OUTPUT/legacy-release.log"

      - name: Verify APK output
        shell: bash
        run: |
          set -euo pipefail

          APK_ROOT="$ANDROID_PROJECT/app/build/outputs/apk"

          echo "APK output root:"
          echo "$APK_ROOT"

          if [ ! -d "$APK_ROOT" ]; then
            echo "ERROR: APK output directory missing."
            exit 1
          fi

          APK_COUNT="$(
            find "$APK_ROOT" \
              -type f \
              -name '*.apk' |
            wc -l |
            tr -d ' '
          )"

          echo "APK count: $APK_COUNT"

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "ERROR: No APK generated."
            exit 1
          fi

          find "$APK_ROOT" \
            -type f \
            -name '*.apk' \
            -print

      - name: Package APKs
        shell: bash
        run: |
          set -euo pipefail

          APK_ROOT="$ANDROID_PROJECT/app/build/outputs/apk"

          mkdir -p "$APK_OUTPUT"

          count=0

          while IFS= read -r -d '' apk; do

            count=$((count + 1))

            filename="$(basename "$apk")"
            variant="$(basename "$(dirname "$apk")")"

            case "$variant" in
              btc)
                output_name="BTC-Quant-btc-release.apk"
                ;;

              full)
                output_name="BTC-Quant-full-release.apk"
                ;;

              legacy)
                output_name="BTC-Quant-legacy-release.apk"
                ;;

              *)
                output_name="BTC-Quant-${filename}"
                ;;
            esac

            size="$(stat -c%s "$apk")"

            echo "APK:"
            echo "$apk"

            echo "Size:"
            echo "$size bytes"

            if [ "$size" -le 1024 ]; then
              echo "ERROR: APK too small."
              exit 1
            fi

            unzip -t "$apk" >/dev/null

            cp -f \
              "$apk" \
              "$APK_OUTPUT/$output_name"

            echo "Packaged:"
            echo "$APK_OUTPUT/$output_name"

          done < <(
            find "$APK_ROOT" \
              -type f \
              -name '*.apk' \
              -print0
          )

          if [ "$count" -eq 0 ]; then
            echo "ERROR: No APK files found."
            exit 1
          fi

          {
            echo '{'
            echo '  "product": "BTC Quant",'
            echo '  "apks": ['

            first=1

            while IFS= read -r -d '' apk; do

              if [ "$first" -eq 0 ]; then
                echo ','
              fi

              first=0

              name="$(basename "$apk")"
              size="$(stat -c%s "$apk")"

              printf \
                '    {"name":"%s","size":%s}' \
                "$name" \
                "$size"

            done < <(
              find "$APK_OUTPUT" \
                -maxdepth 1 \
                -type f \
                -name '*.apk' \
                -print0
            )

            echo
            echo '  ]'
            echo '}'

          } > "$APK_OUTPUT/apk-manifest.json"

          echo "Final release files:"

          find "$APK_OUTPUT" \
            -maxdepth 1 \
            -type f \
            -print

      - name: Final APK validation
        shell: bash
        run: |
          set -euo pipefail

          count=0

          while IFS= read -r -d '' apk; do

            count=$((count + 1))

            size="$(stat -c%s "$apk")"

            echo "Checking:"
            echo "$(basename "$apk")"

            echo "Size:"
            echo "$size bytes"

            if [ "$size" -le 1024 ]; then
              echo "ERROR: APK too small."
              exit 1
            fi

            unzip -t "$apk" >/dev/null

            echo "ZIP integrity: OK"

          done < <(
            find "$APK_OUTPUT" \
              -maxdepth 1 \
              -type f \
              -name '*.apk' \
              -print0
          )

          if [ "$count" -eq 0 ]; then
            echo "ERROR: No packaged APK."
            exit 1
          fi

      - name: Build summary
        if: success()
        shell: bash
        run: |
          {
            echo "# BTC Quant APK Build"
            echo
            echo "## Status"
            echo
            echo "- Build: SUCCESS"
            echo "- APK generation: SUCCESS"
            echo "- APK validation: SUCCESS"
回声
Android_project/app/build/outputs/apk/**
而IFS=read-r-d

回声姓名

大小="$(STAT-C%s"$apk")"

回声"-$(基本名称"$apk")-${大小}字节”

完成<<(
查找"$APK_OUTPUT"\
-max深度1\
-type f\
-name'*.apk'\
-print0
            )

}>>"$GITHUB_STEP_SUMMARY"

      - 姓名: 上传安装包工件
如果: 成功()
uses: 操作/上载工件@v4
和……一起:
姓名: BTC-Quant-Release-APK
路径: |
if-no-file-found
if-no-file-found
if-no-file-found: 误差
保留天数: 姓名名4

姓名4姓名: 上载生成日志
如果: 总是()
uses: 操作/上载工件@v4
和……一起:
姓名: BTC-Quant-Build-Logs
路径: |
build_logs/**
if-no-file-found: 警告
保留天数: 姓名名4

姓名4姓名: 上传安装包诊断
如果: 总是()
uses: 操作/上载工件@v4
和……一起:
姓名: BTC-Quant-APK-Diagnostics
路径: |
Android_project/app/build/outputs/apk/**
if-no-file-found: 警告
保留天数: 7
