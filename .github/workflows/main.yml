name: Build APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Auto-detect and unzip ZIP file
        id: unzip
        run: |
          set -euo pipefail
          ZIP_FILE=$(ls *.zip 2>/dev/null | head -1 || true)
          if [ -z "$ZIP_FILE" ]; then
            echo "No zip file found in repo root"
            exit 1
          fi
          echo "Found ZIP: $ZIP_FILE"
          echo "ZIP_NAME=$ZIP_FILE" >> "$GITHUB_OUTPUT"
          unzip -o "$ZIP_FILE" -d .
          echo "Unzip done"

      - name: Replace QuantApp.kt if exists
        run: |
          set -euo pipefail
          if [ -f ./QuantApp.kt ]; then
            TARGET=$(find . -maxdepth 5 -path "*/app/src/main/java/*/QuantApp.kt" 2>/dev/null | head -1 || true)
            if [ -n "$TARGET" ]; then
              cp -v ./QuantApp.kt "$TARGET"
              echo "Replaced $TARGET"
            else
              echo "QuantApp.kt target not found, skip"
            fi
          else
            echo "No QuantApp.kt at root, use ZIP source"
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK components
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build Debug APK
        id: build
        run: |
          set -euo pipefail
          ROOT=""
          if [ -f settings.gradle.kts ] || [ -f settings.gradle ]; then
            ROOT="."
          else
            FOUND=$(find . -maxdepth 3 \( -name settings.gradle.kts -o -name settings.gradle \) 2>/dev/null | head -1 || true)
            if [ -n "$FOUND" ]; then
              ROOT=$(dirname "$FOUND")
            fi
          fi
          if [ -z "$ROOT" ]; then
            echo "settings.gradle not found"
            exit 1
          fi
          echo "Project root: $ROOT"
          cd "$ROOT"
          rm -rf .gradle
          if [ -f ./gradlew ]; then
            sed -i 's/\r$//' ./gradlew || true
            chmod +x ./gradlew
            ./gradlew --no-daemon clean assembleDebug --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/gradle-build.log"
          else
            gradle --no-daemon clean assembleDebug --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/gradle-build.log"
          fi
          APK=$(find . -path "*/outputs/apk/debug/*.apk" -type f | head -1 || true)
          if [ -z "$APK" ]; then
            echo "Debug APK not found"
            exit 1
          fi
          echo "APK: $APK"
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          cp "$APK" "$GITHUB_WORKSPACE/artifacts/app-debug.apk"

      - name: Package APK as ZIP
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/artifacts"
          zip -9 caifenxi-debug.zip app-debug.apk
          ls -lh caifenxi-debug.zip

      - name: Upload ZIP
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: caifenxi-debug-zip
          path: artifacts/caifenxi-debug.zip
          if-no-files-found: error

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: caifenxi-debug-apk
          path: artifacts/app-debug.apk
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: gradle-build.log
