name: Build APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 自动识别并解压根目录第一个 .zip
      - name: Auto-detect and unzip ZIP file
        id: unzip
        run: |
          set -euo pipefail
          ZIP_FILE=$(ls *.zip 2>/dev/null | head -1 || true)
          if [ -z "$ZIP_FILE" ]; then
            echo "❌ 未找到任何 .zip 文件（请把源码 ZIP 放在仓库根目录）"
            exit 1
          fi
          echo "✅ 找到 ZIP: $ZIP_FILE"
          echo "ZIP_NAME=$ZIP_FILE" >> "$GITHUB_OUTPUT"
          unzip -o "$ZIP_FILE" -d .
          echo "✅ 解压完成"

      # 可选：覆盖 QuantApp.kt（其他项目用；彩分析可忽略）
      - name: Replace QuantApp.kt if exists
        run: |
          set -euo pipefail
          if [ -f ./QuantApp.kt ]; then
            TARGET=$(find . -maxdepth 5 -path "*/app/src/main/java/*/QuantApp.kt" 2>/dev/null | head -1 || true)
