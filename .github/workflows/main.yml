      # 把 APK 打成 ZIP，方便下载
      - name: Package APK as ZIP
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/artifacts"
          zip -9 caifenxi-debug.zip app-debug.apk
          ls -lh caifenxi-debug.zip

      - name: Upload ZIP
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: caifenxi-debug-zip
          path: artifacts/caifenxi-debug.zip
          if-no-files-found: error

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: caifenxi-debug-apk
          path: artifacts/app-debug.apk
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: gradle-build.log
