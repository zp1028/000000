name: Complete APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # ============================================================
      # 1. Checkout
      # ============================================================
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ============================================================
      # 2. Locate Android project
      # ============================================================
      - name: Locate Android Project
        id: locate_root
        shell: bash
        run: |
          set -euo pipefail

          echo "🔍 Searching for Android project..."

          if [ -f "settings.gradle.kts" ] || [ -f "settings.gradle" ]; then
            ROOT="."
          else
            FOUND="$(find . -maxdepth 4 \
              \( -name "settings.gradle.kts" -o -name "settings.gradle" \) \
              -print -quit)"

            if [ -z "${FOUND:-}" ]; then
              echo "❌ settings.gradle(.kts) not found"
              echo ""
              echo "Repository structure:"
              find . -maxdepth 3 -type f | sort | head -100
              exit 1
            fi

            ROOT="$(dirname "$FOUND")"
          fi

          ROOT="$(cd "$ROOT" && pwd)"

          echo "root=$ROOT" >> "$GITHUB_OUTPUT"

          echo "✅ Android project root:"
          echo "$ROOT"

          echo ""
          echo "Project files:"
          find "$ROOT" -maxdepth 2 -type f \
            \( -name "settings.gradle*" \
            -o -name "build.gradle*" \
            -o -name "gradlew" \
            -o -name "gradle.properties" \) \
            -print | sort

      # ============================================================
      # 3. Validate source
      # ============================================================
      - name: Validate Source
        shell: bash
        run: |
          set -euo pipefail

          ROOT="${{ steps.locate_root.outputs.root }}"
          cd "$ROOT"

          echo "🔎 Validating source..."

          test -f "settings.gradle.kts" || \
          test -f "settings.gradle"

          test -f "gradlew"

          if [ -d "app/src/main" ]; then
            echo "✅ app/src/main exists"
          else
            echo "❌ app/src/main not found"
            exit 1
          fi

          if find app/src/main -name "AndroidManifest.xml" -type f \
            | grep -q .; then
            echo "✅ AndroidManifest.xml found"
          else
            echo "❌ AndroidManifest.xml not found"
            exit 1
          fi

          echo ""
          echo "Gradle wrapper:"
          ls -l gradlew

          echo ""
          echo "Android source:"
          find app/src/main -maxdepth 3 -type f | sort | head -100

      # ============================================================
      # 4. JDK 17
      # ============================================================
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # ============================================================
      # 5. Android SDK
      #
      # IMPORTANT:
      # Do NOT use android-actions/setup-android@v3.
      # Do NOT run sdkmanager --licenses.
      # ============================================================
      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"

          export ANDROID_HOME="$SDK_ROOT"
          export ANDROID_SDK_ROOT="$SDK_ROOT"

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          SDKMANAGER="$(command -v sdkmanager || true)"

          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(
              find "$SDK_ROOT/cmdline-tools" \
                -type f \
                -path '*/bin/sdkmanager' \
                -print -quit 2>/dev/null || true
            )"
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "❌ sdkmanager not found"
            exit 1
          fi

          echo "✅ sdkmanager:"
          echo "$SDKMANAGER"

          # ----------------------------------------------------------
          # Seed the standard Android SDK license fingerprints.
          #
          # We intentionally do NOT execute:
          #   sdkmanager --licenses
          #
          # This avoids the unrelated Google TV / XR license scan
          # that was causing the previous CI failure.
          # ----------------------------------------------------------
          mkdir -p "$SDK_ROOT/licenses"

          printf '%s\n' \
            8933bad161af4178b1185d1a37fbf41ea5269c55 \
            d56f5187479451eabf01fb78af6dfcb131a6481e \
            24333f8a63b6825ea9c5514f83c2829b004d1fee \
            84831b9409646a918e30573bab4c9c91346d8abd \
            > "$SDK_ROOT/licenses/android-sdk-license"

          echo "📦 Installing required Android SDK packages..."

          "$SDKMANAGER" --sdk_root="$SDK_ROOT" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo ""
          echo "🔎 Verifying Android SDK..."

          test -d "$SDK_ROOT/platforms/android-35"
          test -d "$SDK_ROOT/build-tools/35.0.0"
          test -d "$SDK_ROOT/platform-tools"

          echo "✅ Android SDK ready"

      # ============================================================
      # 6. Setup Gradle 8.9
      # ============================================================
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
          add-job-summary: on

      # ============================================================
      # 7. Verify Gradle
      # ============================================================
      - name: Verify Gradle Environment
        shell: bash
        run: |
          set -euo pipefail

          ROOT="${{ steps.locate_root.outputs.root }}"
          cd "$ROOT"

          chmod +x gradlew

          echo "☕ Java:"
          java -version

          echo ""
          echo "📦 Gradle:"
          ./gradlew --version

          echo ""
          echo "🤖 Android SDK:"
          echo "ANDROID_HOME=${ANDROID_HOME:-}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-}"

      # ============================================================
      # 8. Static audit
      # ============================================================
      - name: Run Static Audit
        shell: bash
        run: |
          set -euo pipefail

          ROOT="${{ steps.locate_root.outputs.root }}"
          cd "$ROOT"

          if [ -f "tools/v22_static_audit.py" ]; then
            echo "🔍 Running v22 static audit..."
            python3 tools/v22_static_audit.py
          else
            echo "ℹ️ Static audit script not present; skipping."
          fi

      # ============================================================
      # 9. Clean
      # ============================================================
      - name: Clean Project
        shell: bash
        run: |
          set -euo pipefail

          ROOT="${{ steps.locate_root.outputs.root }}"
          cd "$ROOT"

          chmod +x gradlew

          echo "🧹 Cleaning project..."

          ./gradlew clean --no-daemon --stacktrace

          echo "✅ Clean completed"

      # ============================================================
      # 10. Build Debug APK
      #
      # IMPORTANT:
      # No pipe to tail.
      # Therefore Gradle's real exit code is preserved.
      # ============================================================
      - name: Build Debug APK
        id: build_apk
        shell: bash
        run: |
          set -euo pipefail

          ROOT="${{ steps.locate_root.outputs.root }}"
          cd "$ROOT"

          chmod +x gradlew

          echo "========================================"
          echo "🔨 Building Debug APK"
          echo "========================================"
          echo "Project: $(pwd)"
          echo ""

          ./gradlew \
            assembleDebug \
            --no-daemon \
            --stacktrace \
            --info

          echo ""
          echo "========================================"
          echo "✅ APK BUILD SUCCESS"
          echo "========================================"

          echo "build_success=true" >> "$GITHUB_OUTPUT"

      # ============================================================
      # 11. Locate APK
      # ============================================================
      - name: Locate APK
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          ROOT="${{ steps.locate_root.outputs.root }}"
          cd "$ROOT"

          echo "🔍 Searching generated APK..."

          APK_COUNT="$(find . \
            -type f \
            -path '*/build/outputs/apk/debug/*.apk' \
            | wc -l)"

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "❌ No Debug APK found"
            exit 1
          fi

          echo "✅ Found $APK_COUNT APK(s):"

          find . \
            -type f \
            -path '*/build/outputs/apk/debug/*.apk' \
            -print

      # ============================================================
      # 12. Upload APK
      # ============================================================
      - name: Upload Debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BTC-Quant-debug-apk
          path: |
            **/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      # ============================================================
      # 13. Upload build reports/logs
      # ============================================================
      - name: Upload Build Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BTC-Quant-build-reports
          path: |
            **/build/reports/**
            **/build/outputs/logs/**
          if-no-files-found: ignore
          retention-days: 7

      # ============================================================
      # 14. Final summary
      # ============================================================
      - name: Build Summary
        if: always()
        shell: bash
        run: |
          echo "## 📊 BTC Quant APK Build" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "### Build Information" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Time:** $(date '+%Y-%m-%d %H:%M:%S UTC')" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Actor:** ${{ github.actor }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Branch:** ${{ github.ref_name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Commit:** ${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **JDK:** 17" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Gradle:** 8.9" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Compile SDK:** Android 35" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Build Tools:** 35.0.0" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          if [ "${{ steps.build_apk.outputs.build_success }}" = "true" ]; then
            echo "### ✅ BUILD SUCCESS" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Debug APK was generated successfully." >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Artifact: \`BTC-Quant-debug-apk\`" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### ❌ BUILD FAILED" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Check the Gradle build logs and uploaded reports." >> "$GITHUB_STEP_SUMMARY"
          fi
