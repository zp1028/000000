name: Build Release APK

on:
  workflow_dispatch:
    inputs:
      source_zip:
        description: "源码 ZIP 文件名，放在仓库根目录；留空则自动寻找"
        required: false
        default: ""

      gradle_task:
        description: "Gradle 构建任务"
        required: false
        default: "assembleRelease"

  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build-release-apk:

    name: Build Release APK

    runs-on: ubuntu-latest

    env:
      JAVA_VERSION: "17"
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8"
      GRADLE_USER_HOME: "${{ github.workspace }}/.gradle"

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: "1️⃣ Checkout repository"
        uses: actions/checkout@v4


      # ============================================================
      # 2. ENVIRONMENT
      # ============================================================

      - name: "2️⃣ Show build environment"
        shell: bash
        run: |
          set +e

          echo "=================================================="
          echo "BUILD ENVIRONMENT"
          echo "=================================================="

          echo
          echo "Runner:"
          uname -a

          echo
          echo "Architecture:"
          uname -m

          echo
          echo "Workspace:"
          pwd

          echo
          echo "Java before setup:"
          java -version 2>&1 || true

          echo
          echo "Repository files:"
          find . -maxdepth 5 -type f | sort | head -3000


      # ============================================================
      # 3. JDK
      # ============================================================

      - name: "3️⃣ Setup JDK 17"
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"


      # ============================================================
      # 4. FIND ZIP
      # ============================================================

      - name: "4️⃣ Find source ZIP"
        shell: bash
        run: |
          set -e

          INPUT_ZIP="${{ github.event.inputs.source_zip }}"

          echo "=================================================="
          echo "SEARCH SOURCE ZIP"
          echo "=================================================="

          ZIP=""

          if [ -n "$INPUT_ZIP" ]; then

            if [ -f "$INPUT_ZIP" ]; then
              ZIP="$INPUT_ZIP"

            elif [ -f "./$INPUT_ZIP" ]; then
              ZIP="./$INPUT_ZIP"

            else
              echo "::error::指定的 ZIP 不存在：$INPUT_ZIP"

              echo
              echo "当前 ZIP："

              find . \
                -maxdepth 5 \
                -type f \
                -iname "*.zip" \
                -print \
                | sort

              exit 1
            fi

          fi

          if [ -z "$ZIP" ]; then

            mapfile -t ZIP_FILES < <(
              find . \
                -maxdepth 5 \
                -type f \
                -iname "*.zip" \
                -print \
                | sort
            )

            ZIP_COUNT="${#ZIP_FILES[@]}"

            if [ "$ZIP_COUNT" -eq 0 ]; then

              echo "::error::仓库中没有找到源码 ZIP"

              find . \
                -maxdepth 6 \
                -type f \
                -print \
                | sort \
                | head -4000

              exit 1
            fi

            echo
            echo "发现 $ZIP_COUNT 个 ZIP："

            printf '%s\n' "${ZIP_FILES[@]}"

            if [ "$ZIP_COUNT" -eq 1 ]; then

              ZIP="${ZIP_FILES[0]}"

            else

              ZIP=$(
                printf '%s\n' "${ZIP_FILES[@]}" \
                | grep -Ei \
                  "(source|project|caifenxi|btc|quant|android|app|release|fixed|merged|v10)" \
                | head -1 \
                || true
              )

              if [ -z "$ZIP" ]; then
                ZIP="${ZIP_FILES[0]}"
              fi

            fi

          fi

          if [ -z "$ZIP" ]; then
            echo "::error::无法确定源码 ZIP"
            exit 1
          fi

          if [ ! -f "$ZIP" ]; then
            echo "::error::ZIP 文件不存在：$ZIP"
            exit 1
          fi

          echo
          echo "最终源码 ZIP："
          echo "$ZIP"

          echo
          echo "ZIP 大小："
          du -h "$ZIP"

          echo
          echo "ZIP SHA256："
          sha256sum "$ZIP"

          echo "SOURCE_ZIP=$ZIP" >> "$GITHUB_ENV"


      # ============================================================
      # 5. VALIDATE ZIP
      # ============================================================

      - name: "5️⃣ Validate ZIP"
        shell: bash
        run: |
          set -e

          echo "=================================================="
          echo "ZIP VALIDATION"
          echo "=================================================="

          echo "检查：$SOURCE_ZIP"

          unzip -t "$SOURCE_ZIP"

          echo
          echo "✅ ZIP 完整性检查通过"


      # ============================================================
      # 6. EXTRACT
      # ============================================================

      - name: "6️⃣ Extract source ZIP"
        shell: bash
        run: |
          set -e

          echo "=================================================="
          echo "EXTRACT SOURCE ZIP"
          echo "=================================================="

          rm -rf build_source
          rm -rf android_project

          mkdir -p build_source
          mkdir -p android_project

          echo "解压：$SOURCE_ZIP"

          unzip -q "$SOURCE_ZIP" -d build_source

          echo
          echo "✅ ZIP 解压完成"

          echo
          echo "解压目录："

          find build_source \
            -maxdepth 10 \
            -print \
            | sort \
            | head -5000


      # ============================================================
      # 7. SCAN PROJECT
      # ============================================================

      - name: "7️⃣ Scan Android project candidates"
        shell: bash
        run: |
          set -e

          echo "=================================================="
          echo "SCAN ANDROID PROJECT CANDIDATES"
          echo "=================================================="

          CANDIDATES="$GITHUB_WORKSPACE/project_candidates.txt"

          rm -f "$CANDIDATES"

          touch "$CANDIDATES"


          # settings.gradle
          find "$GITHUB_WORKSPACE/build_source" \
            -type f \
            \( \
              -name "settings.gradle" \
              -o \
              -name "settings.gradle.kts" \
            \) \
            -print \
            | while IFS= read -r FILE; do
                dirname "$FILE"
              done >> "$CANDIDATES"


          # gradlew
          find "$GITHUB_WORKSPACE/build_source" \
            -type f \
            -name "gradlew" \
            -print \
            | while IFS= read -r FILE; do
                dirname "$FILE"
              done >> "$CANDIDATES"


          # build.gradle
          find "$GITHUB_WORKSPACE/build_source" \
            -type f \
            \( \
              -name "build.gradle" \
              -o \
              -name "build.gradle.kts" \
            \) \
            -print \
            | while IFS= read -r FILE; do
                dirname "$FILE"
              done >> "$CANDIDATES"


          # AndroidManifest
          find "$GITHUB_WORKSPACE/build_source" \
            -type f \
            -name "AndroidManifest.xml" \
            -print \
            | while IFS= read -r FILE; do

                DIR="$(dirname "$FILE")"

                if [[ "$DIR" == */src/main ]]; then

                  PROJECT_DIR="$(dirname "$(dirname "$DIR")")"

                  echo "$PROJECT_DIR"

                fi

              done >> "$CANDIDATES"


          sort -u "$CANDIDATES" -o "$CANDIDATES"


          echo
          echo "=================================================="
          echo "CANDIDATES"
          echo "=================================================="

          cat "$CANDIDATES"


          if [ ! -s "$CANDIDATES" ]; then

            echo "::error::没有找到 Android/Gradle 工程"

            echo
            echo "解压后的工程文件："

            find "$GITHUB_WORKSPACE/build_source" \
              -maxdepth 12 \
              -type f \
              | sort \
              | head -5000

            exit 1

          fi


          # 关键：
          # 保存到后续 GitHub Actions Step
          echo "CANDIDATES=$CANDIDATES" >> "$GITHUB_ENV"

          echo
          echo "✅ 候选工程列表已保存"


      # ============================================================
      # 8. SCORE
      # ============================================================

      - name: "8️⃣ Score project candidates"
        shell: bash
        run: |
          set -e

          echo "=================================================="
          echo "SCORE ANDROID PROJECTS"
          echo "=================================================="

          CANDIDATES="${CANDIDATES:-$GITHUB_WORKSPACE/project_candidates.txt}"


          if [ ! -f "$CANDIDATES" ]; then

            echo "::error::候选工程列表不存在：$CANDIDATES"

            find "$GITHUB_WORKSPACE" \
              -maxdepth 6 \
              -type f \
              | sort \
              | head -3000

            exit 1

          fi


          if [ ! -s "$CANDIDATES" ]; then
            echo "::error::候选工程列表为空"
            exit 1
          fi


          echo
          echo "候选工程："

          cat "$CANDIDATES"


          BEST_ROOT=""
          BEST_SCORE=-1

          REPORT="$GITHUB_WORKSPACE/project-detection-report.txt"

          rm -f "$REPORT"
          touch "$REPORT"


          while IFS= read -r ROOT; do

            [ -z "$ROOT" ] && continue

            ROOT="${ROOT%$'\r'}"

            if [ ! -d "$ROOT" ]; then
              continue
            fi


            SCORE=0


            if [ -f "$ROOT/settings.gradle" ]; then
              SCORE=$((SCORE + 50))
            fi

            if [ -f "$ROOT/settings.gradle.kts" ]; then
              SCORE=$((SCORE + 50))
            fi

            if [ -f "$ROOT/gradlew" ]; then
              SCORE=$((SCORE + 30))
            fi

            if [ -f "$ROOT/gradle/wrapper/gradle-wrapper.properties" ]; then
              SCORE=$((SCORE + 20))
            fi

            if [ -f "$ROOT/gradle/wrapper/gradle-wrapper.jar" ]; then
              SCORE=$((SCORE + 30))
            fi

            if [ -f "$ROOT/build.gradle" ]; then
              SCORE=$((SCORE + 20))
            fi

            if [ -f "$ROOT/build.gradle.kts" ]; then
              SCORE=$((SCORE + 20))
            fi

            if [ -d "$ROOT/app" ]; then
              SCORE=$((SCORE + 30))
            fi

            if [ -f "$ROOT/app/build.gradle" ]; then
              SCORE=$((SCORE + 30))
            fi

            if [ -f "$ROOT/app/build.gradle.kts" ]; then
              SCORE=$((SCORE + 30))
            fi

            if [ -f "$ROOT/app/src/main/AndroidManifest.xml" ]; then
              SCORE=$((SCORE + 30))
            fi

            if [ -d "$ROOT/app/src/main" ]; then
              SCORE=$((SCORE + 20))
            fi

            if [ -f "$ROOT/gradle.properties" ]; then
              SCORE=$((SCORE + 10))
            fi


            if [ -d "$ROOT/app/src" ]; then

              if find "$ROOT/app/src" \
                -type f \
                -name "*.kt" \
                2>/dev/null \
                | grep -q .; then

                SCORE=$((SCORE + 10))

              fi

            fi


            if [ -d "$ROOT/app/src" ]; then

              if find "$ROOT/app/src" \
                -type f \
                -name "*.java" \
                2>/dev/null \
                | grep -q .; then

                SCORE=$((SCORE + 5))

              fi

            fi


            echo
            echo "------------------------------------------"

            echo "Candidate:"
            echo "$ROOT"

            echo "Score:"
            echo "$SCORE"


            {
              echo "Candidate: $ROOT"
              echo "Score: $SCORE"
              echo

            } >> "$REPORT"


            if [ "$SCORE" -gt "$BEST_SCORE" ]; then

              BEST_SCORE="$SCORE"
              BEST_ROOT="$ROOT"

            fi

          done < "$CANDIDATES"


          echo
          echo "=================================================="
          echo "SELECTED PROJECT"
          echo "=================================================="


          if [ -z "$BEST_ROOT" ]; then

            echo "::error::无法确定 Android 工程根目录"

            exit 1

          fi


          echo "Root:"
          echo "$BEST_ROOT"

          echo
          echo "Score:"
          echo "$BEST_SCORE"


          if [ "$BEST_SCORE" -lt 70 ]; then

            echo "::warning::工程评分低于 70，可能不是完整 Android 工程"

          fi


          echo "DETECTED_ROOT=$BEST_ROOT" >> "$GITHUB_ENV"
          echo "DETECTED_SCORE=$BEST_SCORE" >> "$GITHUB_ENV"


      # ============================================================
      # 9. NORMALIZE
      # ============================================================

      - name: "9️⃣ Normalize Android project root"
        shell: bash
        run: |
          set -e

          echo "=================================================="
          echo "NORMALIZE ANDROID PROJECT"
          echo "=================================================="


          rm -rf "$GITHUB_WORKSPACE/android_project"

          mkdir -p "$GITHUB_WORKSPACE/android_project"


          ROOT="$DETECTED_ROOT"

          REAL_ROOT="$ROOT"


          echo "检测根目录："
          echo "$ROOT"


          mapfile -t INNER_SETTINGS_FILES < <(

            find "$ROOT" \
              -mindepth 1 \
              -type f \
              \( \
                -name "settings.gradle" \
                -o \
                -name "settings.gradle.kts" \
              \) \
              -print \
              | sort

          )


          for SETTINGS_FILE in "${INNER_SETTINGS_FILES[@]}"; do

            INNER_ROOT="$(dirname "$SETTINGS_FILE")"


            if [ \
              -f "$INNER_ROOT/gradlew" \
              ] || \
              [ -f "$INNER_ROOT/build.gradle" ] \
              || \
              [ -f "$INNER_ROOT/build.gradle.kts" ]; then

              REAL_ROOT="$INNER_ROOT"

              break

            fi

          done


          echo
          echo "最终 Android 工程根目录："

          echo "$REAL_ROOT"


          if [ ! -d "$REAL_ROOT" ]; then

            echo "::error::最终工程根目录不存在"

            exit 1

          fi


          cp -a "$REAL_ROOT"/. \
            "$GITHUB_WORKSPACE/android_project/"


          rm -rf "$GITHUB_WORKSPACE/android_project/.gradle"
          rm -rf "$GITHUB_WORKSPACE/android_project/build"
          rm -rf "$GITHUB_WORKSPACE/android_project/app/build"


          if [ -f "$GITHUB_WORKSPACE/android_project/gradlew" ]; then

            chmod +x "$GITHUB_WORKSPACE/android_project/gradlew"

            echo "✅ gradlew 执行权限已修复"

          fi


          echo "PROJECT_ROOT=$GITHUB_WORKSPACE/android_project" \
            >> "$GITHUB_ENV"


          echo
          echo "=================================================="
          echo "NORMALIZED PROJECT"
          echo "=================================================="


          find "$GITHUB_WORKSPACE/android_project" \
            -maxdepth 7 \
            -print \
            | sort \
            | head -5000


      # ============================================================
      # 10. VALIDATE + AUTO REPAIR GRADLE WRAPPER
      # ============================================================

      - name: "🔟 Validate and repair Gradle Wrapper"
        shell: bash
        run: |
          set -e

          cd "$PROJECT_ROOT"


          echo "=================================================="
          echo "FINAL PROJECT VALIDATION"
          echo "=================================================="


          echo
          echo "Project root:"
          pwd


          echo
          echo "Root files:"
          ls -la


          # --------------------------------------------------------
          # Android project structure
          # --------------------------------------------------------

          if [ -f "settings.gradle" ]; then

            echo "✅ settings.gradle"

          elif [ -f "settings.gradle.kts" ]; then

            echo "✅ settings.gradle.kts"

          else

            echo "::error::缺少 settings.gradle / settings.gradle.kts"

            exit 1

          fi


          if [ -f "build.gradle" ] || [ -f "build.gradle.kts" ]; then

            echo "✅ Root build.gradle"

          else

            echo "::warning::Root build.gradle 不存在"

          fi


          if [ -d "app" ]; then

            echo "✅ app module"

          else

            echo "::warning::没有发现 app module"

          fi


          if [ -f "app/src/main/AndroidManifest.xml" ]; then

            echo "✅ AndroidManifest.xml"

          else

            echo "::warning::没有发现 AndroidManifest.xml"

          fi


          # --------------------------------------------------------
          # Gradle wrapper directory
          # --------------------------------------------------------

          mkdir -p gradle/wrapper


          # --------------------------------------------------------
          # Detect Gradle distribution version
          # --------------------------------------------------------

          GRADLE_VERSION=""


          if [ -f "gradle/wrapper/gradle-wrapper.properties" ]; then

            echo
            echo "Gradle Wrapper Properties："

            cat gradle/wrapper/gradle-wrapper.properties


            DISTRIBUTION_URL=$(
              grep -E '^distributionUrl=' \
                gradle/wrapper/gradle-wrapper.properties \
                | head -1 \
                | cut -d'=' -f2- \
                || true
            )


            if [ -n "$DISTRIBUTION_URL" ]; then

              GRADLE_VERSION=$(
                echo "$DISTRIBUTION_URL" \
                | sed -nE 's/.*gradle-([0-9]+\.[0-9]+(\.[0-9]+)?)-.*/\1/p'
              )

            fi

          fi


          # --------------------------------------------------------
          # Default Gradle version
          # --------------------------------------------------------

          if [ -z "$GRADLE_VERSION" ]; then

            GRADLE_VERSION="8.9"

            echo
            echo "⚠️ 无法从 Wrapper Properties 自动读取 Gradle 版本"

            echo "使用默认 Gradle：$GRADLE_VERSION"

          else

            echo
            echo "检测到 Gradle 版本：$GRADLE_VERSION"

          fi


          echo "GRADLE_VERSION=$GRADLE_VERSION" >> "$GITHUB_ENV"


          # --------------------------------------------------------
          # Check wrapper jar
          # --------------------------------------------------------

          WRAPPER_JAR="gradle/wrapper/gradle-wrapper.jar"


          WRAPPER_OK="false"


          if [ -f "$WRAPPER_JAR" ]; then

            echo
            echo "发现 gradle-wrapper.jar："

            ls -lh "$WRAPPER_JAR"


            if unzip -t "$WRAPPER_JAR" >/dev/null 2>&1; then

              if unzip -l "$WRAPPER_JAR" \
                | grep -q "org/gradle/wrapper/GradleWrapperMain.class"; then

                WRAPPER_OK="true"

                echo "✅ Gradle Wrapper JAR 完整"

              else

                echo "⚠️ gradle-wrapper.jar 缺少 GradleWrapperMain"

              fi

            else

              echo "⚠️ gradle-wrapper.jar ZIP/JAR 校验失败"

            fi

          else

            echo
            echo "⚠️ gradle-wrapper.jar 不存在"

          fi


          # --------------------------------------------------------
          # Auto repair wrapper
          # --------------------------------------------------------

          if [ "$WRAPPER_OK" != "true" ]; then

            echo
            echo "=================================================="
            echo "AUTO REPAIR GRADLE WRAPPER"
            echo "=================================================="


            echo
            echo "Gradle version:"
            echo "$GRADLE_VERSION"


            echo
            echo "尝试使用系统 Gradle 生成 Wrapper..."


            # Install the required Gradle distribution directly.
            GRADLE_INSTALL_DIR="$RUNNER_TEMP/gradle-$GRADLE_VERSION"


            if [ ! -x "$GRADLE_INSTALL_DIR/bin/gradle" ]; then

              echo "下载 Gradle $GRADLE_VERSION"


              GRADLE_ZIP="$RUNNER_TEMP/gradle-$GRADLE_VERSION-bin.zip"


              curl \
                --fail \
                --location \
                --retry 5 \
                --retry-delay 3 \
                --connect-timeout 30 \
                --max-time 300 \
                -o "$GRADLE_ZIP" \
                "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip"


              rm -rf "$GRADLE_INSTALL_DIR"


              mkdir -p "$RUNNER_TEMP/gradle-extract"


              unzip -q \
                "$GRADLE_ZIP" \
                -d "$RUNNER_TEMP/gradle-extract"


              mv \
                "$RUNNER_TEMP/gradle-extract/gradle-$GRADLE_VERSION" \
                "$GRADLE_INSTALL_DIR"


              rm -rf "$RUNNER_TEMP/gradle-extract"

            fi


            echo
            echo "系统 Gradle："

            "$GRADLE_INSTALL_DIR/bin/gradle" \
              --version


            # ------------------------------------------------------
            # Recreate wrapper
            # ------------------------------------------------------

            rm -f "$WRAPPER_JAR"


            "$GRADLE_INSTALL_DIR/bin/gradle" \
              wrapper \
              --gradle-version "$GRADLE_VERSION" \
              --distribution-type bin \
              --no-daemon


            chmod +x gradlew


            echo
            echo "Wrapper 修复完成："

            ls -lh \
              gradle/wrapper/gradle-wrapper.jar


            # ------------------------------------------------------
            # Verify repaired wrapper
            # ------------------------------------------------------

            if [ ! -f "$WRAPPER_JAR" ]; then

              echo "::error::Wrapper 自动修复失败：gradle-wrapper.jar 仍不存在"

              exit 1

            fi


            if ! unzip -t "$WRAPPER_JAR" >/dev/null 2>&1; then

              echo "::error::修复后的 gradle-wrapper.jar 无法读取"

              exit 1

            fi


            if ! unzip -l "$WRAPPER_JAR" \
              | grep -q "org/gradle/wrapper/GradleWrapperMain.class"; then

              echo "::error::修复后的 Wrapper 缺少 GradleWrapperMain"

              exit 1

            fi


            echo
            echo "✅ Gradle Wrapper 自动修复成功"

          else

            echo
            echo "✅ Gradle Wrapper 已完整，无需修复"

          fi


          # --------------------------------------------------------
          # Final wrapper test
          # --------------------------------------------------------

          chmod +x gradlew


          echo
          echo "=================================================="
          echo "GRADLE WRAPPER TEST"
          echo "=================================================="


          ./gradlew \
            --version \
            --no-daemon


          echo
          echo "✅ Gradle Wrapper 工作正常"


      # ============================================================
      # 11. PREPARE GRADLE
      # ============================================================

      - name: "1️⃣1️⃣ Prepare Gradle environment"
        shell: bash
        run: |
          set -e

          cd "$PROJECT_ROOT"


          echo "=================================================="
          echo "GRADLE ENVIRONMENT"
          echo "=================================================="


          mkdir -p "$GRADLE_USER_HOME"


          echo
          echo "GRADLE_USER_HOME:"
          echo "$GRADLE_USER_HOME"


          echo
          echo "Java:"
          java -version


          echo
          echo "Gradle:"
          ./gradlew --version


          echo
          echo "Gradle Wrapper Properties:"

          cat \
            gradle/wrapper/gradle-wrapper.properties \
            2>/dev/null \
            || true


      # ============================================================
      # 12. ANALYZE CONFIG
      # ============================================================

      - name: "1️⃣2️⃣ Analyze Gradle configuration"
        shell: bash
        run: |
          set +e

          cd "$PROJECT_ROOT"


          echo "=================================================="
          echo "GRADLE CONFIGURATION"
          echo "=================================================="


          echo
          echo "Java:"

          java -version


          echo
          echo "Gradle:"

          ./gradlew --version


          echo
          echo "Gradle Wrapper:"

          cat \
            gradle/wrapper/gradle-wrapper.properties \
            2>/dev/null \
            || true


          echo
          echo "Gradle properties:"

          cat gradle.properties \
            2>/dev/null \
            || true


          echo
          echo "Settings:"

          if [ -f settings.gradle.kts ]; then

            sed -n '1,400p' settings.gradle.kts

          elif [ -f settings.gradle ]; then

            sed -n '1,400p' settings.gradle

          fi


          echo
          echo "Root build.gradle:"

          if [ -f build.gradle.kts ]; then

            sed -n '1,400p' build.gradle.kts

          elif [ -f build.gradle ]; then

            sed -n '1,400p' build.gradle

          fi


      # ============================================================
      # 13. CLEAN
      # ============================================================

      - name: "1️⃣3️⃣ Gradle clean"
        shell: bash
        run: |
          set -o pipefail

          cd "$PROJECT_ROOT"


          echo "=================================================="
          echo "GRADLE CLEAN"
          echo "=================================================="


          ./gradlew clean \
            --stacktrace \
            --no-daemon \
            2>&1 \
            | tee "$GITHUB_WORKSPACE/gradle-clean.log"


      # ============================================================
      # 14. BUILD RELEASE
      # ============================================================

      - name: "1️⃣4️⃣ Build Release APK"
        id: release_build
        shell: bash
        run: |
          set -o pipefail

          cd "$PROJECT_ROOT"


          TASK="${{ github.event.inputs.gradle_task }}"


          if [ -z "$TASK" ]; then
            TASK="assembleRelease"
          fi


          echo "=================================================="
          echo "BUILD RELEASE APK"
          echo "=================================================="


          echo
          echo "Project:"
          pwd


          echo
          echo "Gradle task:"
          echo "$TASK"


          echo
          echo "Java:"
          java -version


          echo
          echo "Gradle:"
          ./gradlew --version


          echo
          echo "开始 Release 构建..."


          ./gradlew "$TASK" \
            --stacktrace \
            --info \
            --no-daemon \
            2>&1 \
            | tee "$GITHUB_WORKSPACE/gradle-build.log"


      # ============================================================
      # 15. FAILURE ANALYSIS
      # ============================================================

      - name: "1️⃣5️⃣ Analyze build failure"
        if: failure()
        shell: bash
        run: |
          set +e


          LOG="$GITHUB_WORKSPACE/gradle-build.log"


          echo "=================================================="
          echo "BUILD FAILURE ANALYSIS"
          echo "=================================================="


          if [ ! -f "$LOG" ]; then

            echo "::error::gradle-build.log 不存在"

            exit 0

          fi


          echo
          echo "=================================================="
          echo "1. FAILURE"
          echo "=================================================="

          grep -nE \
            "FAILURE:|What went wrong:|Execution failed|BUILD FAILED" \
            "$LOG" \
            | tail -100 \
            || true


          echo
          echo "=================================================="
          echo "2. KOTLIN"
          echo "=================================================="

          grep -nE \
            "e: .*\.kt:|Unresolved reference|Type mismatch|Expecting|Cannot infer|Unresolved" \
            "$LOG" \
            | tail -250 \
            || true


          echo
          echo "=================================================="
          echo "3. JAVA"
          echo "=================================================="

          grep -nE \
            "error: .*\.java:|cannot find symbol|package .* does not exist" \
            "$LOG" \
            | tail -250 \
            || true


          echo
          echo "=================================================="
          echo "4. DEPENDENCIES"
          echo "=================================================="

          grep -niE \
            "Could not resolve|Could not find|Could not GET|Could not HEAD|Failed to resolve|Connection timed out|Connection reset" \
            "$LOG" \
            | tail -250 \
            || true


          echo
          echo "=================================================="
          
